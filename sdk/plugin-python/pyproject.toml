[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "platform-factory-plugin"
version = "1.0.0"
description = "SDK for out-of-process platform-factory language plugins: the versioned, length-prefixed JSON-RPC protocol plugins speak over stdin/stdout, and the plugin-side Server."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://github.com/CYPT71/platform-factory"

[tool.setuptools.packages.find]
include = ["secure_oci_plugin*"]
