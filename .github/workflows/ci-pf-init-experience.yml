name: pf-init-experience

on:
  pull_request:
  push:

permissions: {contents: read}

jobs:
  personas-and-tui:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with: {go-version: '1.25.12', cache: true}
      - name: Validate the complete empty-repository and TUI experience
        env: {GOTOOLCHAIN: local}
        run: |
          set -euo pipefail
          go test ./cmd/platform-factory -count=1 -run 'TestPFInit|TestMarketplaceExperienceFromEmptyDirectory|TestResolveEcosystem|TestConfirmPlan|TestPluginCreate|TestPluginInstall'
          go test ./internal/marketplace ./cmd/tui/marketplacetui -count=1
      - name: Validate intermediate and senior clean-workspace experiences
        env: {GOTOOLCHAIN: local}
        run: |
          set -euo pipefail
          ./demo/validate-personas.sh

  local-container-engines:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: docker
            test: TestJuniorDeploysHelloWorldToRealLocalDocker
          - engine: podman
            test: TestJuniorDeploysHelloWorldToRealLocalPodman
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with: {go-version: '1.25.12', cache: true}
      - name: Install Podman
        if: matrix.engine == 'podman'
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y podman
      - name: Validate the junior launch against a real local engine
        env: {GOTOOLCHAIN: local, PF_REQUIRE_REAL_RUNTIME: '1'}
        run: |
          set -euo pipefail
          go test ./cmd/platform-factory -run '^${{ matrix.test }}$' -count=1 -v
          ./demo/validate.sh '${{ matrix.engine }}'
