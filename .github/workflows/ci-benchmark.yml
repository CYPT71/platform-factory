name: benchmark
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:
permissions: {contents: read}

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with: {go-version: '1.25.12', cache: true}
      - name: Record the full reproducibility environment
        env: {GOTOOLCHAIN: local}
        run: |
          set -euo pipefail
          {
            go version
            uname -a
            echo "num_cpu=$(nproc)"
            echo "gomaxprocs_default=$(nproc)"
            grep -m1 'model name' /proc/cpuinfo || true
            echo "kernel=$(uname -r)"
          } | tee benchmark-environment.txt
      - name: Run the sequential benchmark families at a fixed GOMAXPROCS=1
        # -cpu=1 pins GOMAXPROCS for BenchmarkBuild/MakeLayer/NaiveTarGzip:
        # none of them use goroutines internally, so this removes scheduler
        # noise from the numbers instead of leaving an unexplained "-12"
        # (or whatever the runner's core count is) in the results.
        # Fixed iteration/count values keep the campaign bounded even for
        # the largest payload while still producing repeat samples.
        env: {GOTOOLCHAIN: local}
        run: |
          set -euo pipefail
          echo "::group::Sequential benchmarks (Build, MakeLayer, NaiveTarGzip)"
          go test ./internal/ociruntime -run '^$' \
            -bench '^(BenchmarkBuild|BenchmarkMakeLayer|BenchmarkNaiveTarGzip)$' \
            -benchmem -benchtime=1x -count=5 -cpu=1 \
            | tee benchmark-sequential.txt
          echo "::endgroup::"
      - name: Run BenchmarkBuildParallel at the runner's real GOMAXPROCS
        # Deliberately NOT -cpu=1 here: this benchmark exists specifically
        # to exercise concurrent Build() calls, so it needs real
        # parallelism (the runner's default GOMAXPROCS, matching its CPU
        # count recorded above) rather than pinning it away.
        env: {GOTOOLCHAIN: local}
        run: |
          set -euo pipefail
          echo "::group::BenchmarkBuildParallel (1/2/4/8/16 concurrent builds)"
          go test ./internal/ociruntime -run '^$' -bench '^BenchmarkBuildParallel$' \
            -benchmem -benchtime=32x -count=5 \
            | tee benchmark-parallel.txt
          echo "::endgroup::"
      - name: Capture focused CPU and memory profiles
        env: {GOTOOLCHAIN: local}
        run: |
          set -euo pipefail
          go test ./internal/ociruntime -run '^$' \
            -bench '^BenchmarkBuild/payload_4096KiB$' -benchtime=3x -count=1 -cpu=1 \
            -cpuprofile=cpu.prof -memprofile=mem.prof -memprofilerate=1 \
            > benchmark-profile.txt
      - name: Check for goroutine or file-descriptor leaks around a build
        env: {GOTOOLCHAIN: local}
        run: |
          set -euo pipefail
          go test ./internal/ociruntime -run '^TestBuildLeavesNoGoroutinesOrFilesBehind$' -v | tee leak-check.txt
      - name: Race-detector pass on the concurrent path (separate from perf numbers)
        env: {GOTOOLCHAIN: local}
        run: |
          set -euo pipefail
          go test ./internal/ociruntime -run '^$' -bench '^BenchmarkBuildParallel$' -benchtime=16x -race \
            | tee benchmark-race.txt
      - name: Build the statistical report
        run: |
          set -euo pipefail
          cat benchmark-sequential.txt benchmark-parallel.txt > benchmark.txt
          export BENCHMARK_NUM_CPU="$(nproc)"
          export BENCHMARK_GOMAXPROCS="$(nproc)"
          export BENCHMARK_CPU_FIXED="1 for BenchmarkBuild/MakeLayer/NaiveTarGzip; default ($BENCHMARK_NUM_CPU) for BenchmarkBuildParallel"
          export BENCHMARK_COMMAND="go test ./internal/ociruntime -bench '(BenchmarkBuild|BenchmarkMakeLayer|BenchmarkNaiveTarGzip)' -benchmem -benchtime=1x -count=5 -cpu=1; go test ./internal/ociruntime -bench BenchmarkBuildParallel -benchmem -benchtime=32x -count=5"
          python3 scripts/ci/benchmark-report.py benchmark.txt benchmark-environment.txt benchmark.json benchmark.md
      - name: Render payload-size charts (throughput, memory/op, time/op)
        run: |
          set -euo pipefail
          python3 scripts/ci/render-benchmark-charts.py benchmark.json charts
      - name: Render CPU and memory profiles as text (pprof requires no server/browser)
        env: {GOTOOLCHAIN: local}
        run: |
          set -euo pipefail
          go tool pprof -top -nodecount=25 cpu.prof > cpu-profile-top.txt
          go tool pprof -top -alloc_space -nodecount=25 mem.prof > mem-profile-top.txt
      - name: Link benchmark evidence to this workflow run
        if: always()
        run: |
          set -euo pipefail
          python3 scripts/ci/write-traceability.py traceability.json \
            benchmark.txt benchmark.json benchmark.md benchmark-environment.txt \
            cpu-profile-top.txt mem-profile-top.txt leak-check.txt benchmark-race.txt \
            benchmark-profile.txt charts/throughput.svg charts/memory.svg charts/time.svg
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: |
            benchmark.txt
            benchmark.json
            benchmark.md
            benchmark-environment.txt
            cpu.prof
            mem.prof
            cpu-profile-top.txt
            mem-profile-top.txt
            leak-check.txt
            benchmark-race.txt
            benchmark-profile.txt
            charts/throughput.svg
            charts/memory.svg
            charts/time.svg
            traceability.json
          if-no-files-found: error
          retention-days: 90
      - name: Extract just the BenchmarkBuild lines for cross-run comparison
        run: |
          set -euo pipefail
          grep '^BenchmarkBuild/' benchmark-sequential.txt > benchmark-build-only.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-json-only
          path: |
            benchmark.json
            benchmark-build-only.txt
          if-no-files-found: error
          retention-days: 90

  compare-with-main:
    needs: benchmark
    # Scoped to BenchmarkBuild only (the canonical end-to-end path) and a
    # smaller -count, to keep this second full benchmark pass affordable;
    # the primary `benchmark` job above still gets the full family/count
    # treatment. Skipped on main itself (nothing to compare against) and
    # on forks without enough history for a meaningful diff.
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: {contents: read, pull-requests: write}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - name: Install the pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with: {go-version: '1.25.12', cache: true}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: benchmark-json-only, path: current}
      - name: Benchmark main's code with this branch's own reporting scripts
        # Checks out main's *source* into a worktree (what's measured) but
        # always runs the scripts already on this branch (how it's
        # measured/reported) - the same "trusted verifier, not trusted
        # subject" pattern this project already uses for OCI layout
        # verification, so an older benchmark.py schema on main can never
        # produce a report this comparison can't parse.
        env: {GOTOOLCHAIN: local}
        run: |
          set -euo pipefail
          base_ref="${{ github.event.pull_request.base.ref }}"
          base_ref="${base_ref:-main}"
          echo "$base_ref" > /tmp/main-ref.txt
          git fetch origin "$base_ref" --depth=1
          git worktree add /tmp/main-worktree FETCH_HEAD
          (
            cd /tmp/main-worktree
            go test ./internal/ociruntime -run '^$' -bench '^BenchmarkBuild$' \
              -benchmem -benchtime=1x -count=5 -cpu=1 > /tmp/main-benchmark.txt
          )
          go version > /tmp/main-environment.txt
          python3 scripts/ci/benchmark-report.py /tmp/main-benchmark.txt /tmp/main-environment.txt main-benchmark.json main-benchmark.md
      - name: Install benchstat (pinned)
        env: {GOTOOLCHAIN: local}
        run: |
          set -euo pipefail
          go install golang.org/x/perf/cmd/benchstat@82a0b07e230d76fa1b3036c383d7a98172f87334
      - name: Statistical A/B comparison with benchstat
        env: {GOTOOLCHAIN: local}
        run: |
          set -euo pipefail
          {
            echo '```'
            "$(go env GOPATH)/bin/benchstat" /tmp/main-benchmark.txt current/benchmark-build-only.txt
            echo '```'
          } > benchstat.md
          cat benchstat.md
      - name: Compare this branch against main (threshold check)
        run: |
          set -euo pipefail
          python3 scripts/ci/compare-benchmarks.py current/benchmark.json main-benchmark.json comparison.md
          cat comparison.md
      - name: Combine both comparisons into one PR-ready report
        run: |
          set -euo pipefail
          {
            echo "# platform-factory-base benchmark: this branch vs. $(cat /tmp/main-ref.txt 2>/dev/null || echo main)"
            echo
            echo "## benchstat (statistical A/B comparison, BenchmarkBuild only)"
            echo
            cat benchstat.md
            echo
            cat comparison.md
          } > pr-comment.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-comparison
          path: |
            pr-comment.md
            benchstat.md
            comparison.md
            main-benchmark.json
            main-benchmark.md
          if-no-files-found: error
          retention-days: 90
      - name: Comment the comparison on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr comment "${{ github.event.pull_request.number }}" --body-file pr-comment.md \
            --repo "${{ github.repository }}" --edit-last --create-if-none

  benchmark-history:
    needs: benchmark
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: benchmark-json-only}
      - name: Append this run's results to the tracked history file
        run: |
          set -euo pipefail
          python3 scripts/ci/append-benchmark-history.py benchmark.json benchmark-history.jsonl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-history-${{ github.sha }}
          path: benchmark-history.jsonl
          if-no-files-found: error
          retention-days: 90

  sign-benchmark-evidence:
    needs: benchmark
    # Keyless Cosign signing mints a Sigstore certificate under this
    # workflow's identity - restricted to push on main only, the same
    # reasoning ci-release.yml and ci-microvm.yml apply to their own
    # signing jobs (see Threat-Model-and-Residual-Risks in the wiki).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {contents: read, id-token: write}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: benchmark-json-only}
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: {cosign-release: 'v3.0.6'}
      - name: Sign and verify the benchmark evidence (keyless)
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle benchmark.json.cosign.bundle benchmark.json
          cosign verify-blob \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci-benchmark.yml@" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --bundle benchmark.json.cosign.bundle benchmark.json \
            | tee benchmark-evidence-verification.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-benchmark-evidence
          path: |
            benchmark.json
            benchmark.json.cosign.bundle
            benchmark-evidence-verification.txt
          if-no-files-found: error
          retention-days: 90
