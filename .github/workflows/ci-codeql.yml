name: codeql-analysis

on:
  push:
  pull_request:
  schedule: [{cron: '29 3 * * 1'}]

permissions: {contents: read, security-events: write}

jobs:
  analyze-go:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with: {go-version-file: go.mod, cache: true}
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with: {languages: go, build-mode: manual}
      - name: Build Go for CodeQL extraction
        env: {GOTOOLCHAIN: local}
        run: |
          set -euo pipefail
          go build ./...
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with: {category: '/language:go'}
