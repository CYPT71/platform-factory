name: mcp-server-image

# Builds the `pf mcp serve` image and pushes it to GHCR. The image
# content itself is produced entirely by this repository's own native
# OCI builder (cmd/oci-builder, scripts/ci/build-mcp-image-layout.sh) -
# no Dockerfile RUN step ever compiles code or assembles layers. Docker
# buildx is used only as the transport that re-wraps the already-built,
# already-verified layout (via Dockerfile.mcp - mechanically the same
# verify/unpack/scratch shape as the repository-root Dockerfile the
# main release image uses, kept as its own file so the MCP image build
# can evolve independently) to get a real multi-arch manifest list and
# registry push - the same split already established for the main
# release image.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions: {contents: read}

jobs:
  build-and-push:
    environment: release
    permissions: {contents: read, packages: write, id-token: write}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with: {go-version: '1.25.12', cache: true}
      - name: Build and verify the MCP server OCI layout natively (amd64 + arm64)
        env: {GOTOOLCHAIN: local}
        run: |
          set -euo pipefail
          scripts/ci/build-mcp-image-layout.sh layout-amd64 payload-amd64 amd64
          scripts/ci/build-mcp-image-layout.sh layout-arm64 payload-arm64 arm64
      - name: Set up an attestation-capable BuildKit builder
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with: {driver: docker-container}
      - name: Determine image tag(s)
        id: tags
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            printf 'primary=%s\n' "${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            printf 'primary=latest\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Push the layout-derived image by digest
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.tags.outputs.primary }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')-mcp"
          echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          for arch in amd64 arm64; do
            context="${RUNNER_TEMP}/mcp-image-${arch}"
            mkdir -p "$context/scripts/ci"
            cp Dockerfile.mcp "$context/Dockerfile.mcp"
            cp scripts/ci/verify-oci-layout.py "$context/scripts/ci/"
            cp -a "layout-${arch}" "$context/oci-image"
            docker buildx build --pull=false --platform "linux/${arch}" \
              --file "$context/Dockerfile.mcp" \
              --provenance=mode=max --sbom=true --push \
              --tag "$IMAGE:$TAG-${arch}" "$context"
          done
          docker buildx imagetools create --tag "$IMAGE:$TAG" \
            "$IMAGE:$TAG-amd64" "$IMAGE:$TAG-arm64"
          digest=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' | jq -er '.digest')
          case "$digest" in sha256:[0-9a-f][0-9a-f]*) ;; *) echo "invalid published digest: $digest" >&2; exit 1;; esac
          echo "$digest" > image.digest
          printf 'published_image=%s@%s\n' "$IMAGE" "$digest"
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: {cosign-release: 'v3.0.6'}
      - name: Keylessly sign and verify the published digest
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')-mcp"
          digest=$(cat image.digest)
          cosign sign --yes "$IMAGE@$digest"
          cosign verify --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci-mcp-image.yml@" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE@$digest"
