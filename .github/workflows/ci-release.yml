name: release-evidence

on:
  push:
    tags: ['v*.*.*']

permissions: {contents: read}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with: {go-version: '1.25.12', cache: true}
      - name: Validate immutable strict SemVer source
        env:
          TAG: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release tag is not strict SemVer vMAJOR.MINOR.PATCH: $TAG" >&2
            exit 1
          fi
          tag_sha=$(git rev-list -n 1 "$TAG")
          test "$tag_sha" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          printf 'RELEASE_SOURCE_OK tag=%s sha=%s\n' "$TAG" "$tag_sha" | tee release-source.txt
      - name: Build and validate the release layout
        env: {GOTOOLCHAIN: local}
        run: |
          set -euo pipefail
          scripts/ci/build-verified-layout.sh layout-amd64 payload-amd64 amd64 | tee release-validation.txt
          scripts/ci/build-verified-layout.sh layout-arm64 payload-arm64 arm64 | tee -a release-validation.txt
          python3 scripts/ci/assemble-multiarch.py multiarch-layout layout-amd64 layout-arm64
          go run ./cmd/platform-factory verify multiarch-layout | tee -a release-validation.txt
          sha256sum payload-amd64 payload-arm64 layout-amd64/blobs/sha256/* \
            layout-arm64/blobs/sha256/* multiarch-layout/blobs/sha256/* \
            | sort > layout-checksums.sha256
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -cf verified-layout.tar layout-amd64 layout-arm64 multiarch-layout \
            payload-amd64 payload-arm64 layout-checksums.sha256 release-validation.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release-layout
          path: |
            verified-layout.tar
            release-source.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: validate
    environment: release
    permissions: {contents: read, packages: write}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with: {go-version: '1.25.12', cache: true}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: verified-release-layout}
      - name: Unpack independently validated layout
        env: {GOTOOLCHAIN: local}
        run: |
          set -euo pipefail
          tar -xf verified-layout.tar
          python3 scripts/ci/verify-oci-layout.py layout-amd64
          python3 scripts/ci/verify-oci-layout.py layout-arm64
          go run ./cmd/platform-factory verify multiarch-layout
      - name: Set up an attestation-capable BuildKit builder
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with: {driver: docker-container}
      - name: Publish the layout-derived image by digest
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          for arch in amd64 arm64; do
            context="${RUNNER_TEMP}/release-${arch}"
            mkdir -p "$context/scripts/ci"
            cp Dockerfile "$context/Dockerfile"
            cp scripts/ci/verify-oci-layout.py "$context/scripts/ci/"
            cp -a "layout-${arch}" "$context/oci-image"
            docker buildx build --pull=false --platform "linux/${arch}" \
              --provenance=mode=max --sbom=true --push \
              --tag "$IMAGE:$TAG-${arch}" "$context"
          done
          docker buildx imagetools create --tag "$IMAGE:$TAG" \
            "$IMAGE:$TAG-amd64" "$IMAGE:$TAG-arm64"
          docker buildx imagetools inspect "$IMAGE:$TAG" \
            --format '{{json .Manifest}}' > published-manifest.json
          jq -er '.digest' published-manifest.json > image.digest
          digest=$(cat image.digest)
          case "$digest" in sha256:[0-9a-f][0-9a-f]*) ;; *) echo "invalid published digest: $digest" >&2; exit 1;; esac
          docker buildx imagetools inspect --raw "$IMAGE@$digest" > published-index.json
          python3 scripts/ci/verify-attestation-index.py published-index.json | tee attestation-validation.txt
          docker pull --platform linux/amd64 "$IMAGE:$TAG-amd64"
          docker save --output platform-factory-image-amd64.tar "$IMAGE:$TAG-amd64"
          docker pull --platform linux/arm64 "$IMAGE:$TAG-arm64"
          docker save --output platform-factory-image-arm64.tar "$IMAGE:$TAG-arm64"
          sha256sum platform-factory-image-amd64.tar platform-factory-image-arm64.tar > image-tar.sha256
          printf 'layout_archive_sha256=%s\npublished_image=%s@%s\n' "$(sha256sum verified-layout.tar | cut -d' ' -f1)" "$IMAGE" "$digest" > publication-link.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-image-evidence
          path: |
            platform-factory-image-amd64.tar
            platform-factory-image-arm64.tar
            image-tar.sha256
            image.digest
            publication-link.txt
            published-index.json
            attestation-validation.txt
            release-source.txt
            verified-layout.tar
          if-no-files-found: error
          retention-days: 90

  sign:
    needs: publish
    environment: release
    permissions: {contents: read, packages: write, id-token: write}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: published-image-evidence}
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io \
              --username "$GHCR_USER" \
              --password-stdin
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: {cosign-release: 'v3.0.6'}
      - name: Sign and verify the immutable image digest
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          digest=$(cat image.digest)
          cosign sign --yes "$IMAGE@$digest"
          cosign verify --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci-release.yml@" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE@$digest" | tee signature-verification.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release-evidence
          path: |
            platform-factory-image-amd64.tar
            platform-factory-image-arm64.tar
            image-tar.sha256
            image.digest
            publication-link.txt
            published-index.json
            attestation-validation.txt
            release-source.txt
            verified-layout.tar
            signature-verification.json
          if-no-files-found: error
          retention-days: 90

  release:
    needs: sign
    environment: release
    permissions: {contents: write}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: signed-release-evidence}
      - name: Package auditable release reports
        run: |
          set -euo pipefail
          mkdir release-reports
          cp image.digest image-tar.sha256 publication-link.txt release-source.txt signature-verification.json verified-layout.tar release-reports/
          (cd release-reports && zip -qr ../platform-factory-reports.zip .)
      - name: Create immutable semantic-version release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --verify-tag --generate-notes \
            platform-factory-image-amd64.tar platform-factory-image-arm64.tar \
            platform-factory-reports.zip image-tar.sha256 publication-link.txt
